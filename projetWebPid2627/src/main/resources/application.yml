spring:
  application:
    name: projetWebPid2627
  main:
    banner-mode: off
  messages:
    basename:
    - messages
    encoding: UTF-8
  profiles:
    active:
    - dev
---
spring:
  config:
    activate:
      on-profile:
      - dev
  datasource:
    url: jdbc:h2:~/PID_DB/pidDB2627
    username: sa
    password: 
  sql:
    init:
      mode: always
      encoding: UTF-8
      platform: h2
  jpa:
    hibernate:
      ddl-auto: update
  
    database-platform: 'org.hibernate.dialect.H2Dialect'

    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        trace: false
        web-allow-others: false
logging:
 level:
   '[org.isfce.pid.controller]': DEBUG
   '[org.hibernate.SQL]': DEBUG
   '[org.hibernate.type.descriptor.sql.BasicBinder]': TRACE
server:
  port: 8080

