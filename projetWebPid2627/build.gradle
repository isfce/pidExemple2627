plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.+'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.isfce.pid'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	
	//WebJar
	implementation 'org.webjars:bootstrap:5.3.+'
	implementation 'org.webjars:jquery:3.7.+'
	implementation 'org.webjars:popper.js:2.11.+'
	implementation 'org.webjars:font-awesome:6.4.0'
	implementation 'org.webjars.npm:bootbox:6.0.4'
	
	//Pour permettre une utilisation des webjar sans préciser la version
	//et détecter l'endroit où se trouve les webjar
	implementation 'org.webjars:webjars-locator-lite'
}

tasks.named('test') {
	useJUnitPlatform()
}
